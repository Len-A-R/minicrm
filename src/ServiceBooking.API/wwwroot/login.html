<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServiceBooking · Вход</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <header class="auth-header">
        <p class="eyebrow">ServiceBooking</p>
        <h1>Вход в систему</h1>
      </header>

      <form class="auth-form" id="login-form">
        <div class="field-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="login-password">Пароль</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <label class="checkbox-line" for="login-remember">
          <input id="login-remember" type="checkbox">
          <span>Запомнить меня</span>
        </label>
        <button class="primary-button" type="submit">Войти</button>
        <a class="auth-link" href="/register.html">Зарегистрироваться</a>
      </form>

      <div class="result-banner auth-result" id="login-result" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
